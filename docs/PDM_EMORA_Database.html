<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDM — EMORA App Database</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #E8ECF0; font-family: 'Segoe UI', Arial, sans-serif; }
    .header {
      background: linear-gradient(135deg, #1A3A5C 0%, #2C5282 100%);
      color: white; padding: 18px 32px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 12px #00000040;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .header .meta { font-size: 11px; color: #90A8C3; text-align: right; line-height: 1.6; }
    .toolbar {
      background: #1E3A5F; padding: 8px 32px;
      display: flex; gap: 8px; align-items: center;
      border-bottom: 2px solid #2D5986;
    }
    .toolbar button {
      background: #2D5986; color: #BEE3F8; border: 1px solid #4A90D9;
      padding: 4px 14px; border-radius: 4px; font-size: 11px; cursor: pointer;
      transition: background 0.2s;
    }
    .toolbar button:hover { background: #4A90D9; color: white; }
    .toolbar span { color: #7AA3C8; font-size: 11px; margin-left: auto; }
    .canvas-wrapper {
      overflow: auto; padding: 24px;
      max-height: calc(100vh - 100px);
    }
    .canvas-wrapper svg {
      display: block;
      transform-origin: top left;
      transition: transform 0.2s;
      filter: drop-shadow(0 8px 24px #00000030);
      border-radius: 4px;
    }
    /* Zoom controls */
    #zoom-level { color: #BEE3F8; font-size: 11px; padding: 0 8px; min-width: 50px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>📊 EMORA App — Physical Data Model (PDM)</h1>
      <div style="font-size:12px; color:#90CDF4; margin-top:4px;">Database: MongoDB Atlas &nbsp;|&nbsp; Backend: Laravel 11 &nbsp;|&nbsp; Collections: 9 &nbsp;|&nbsp; Version: 1.0</div>
    </div>
    <div class="meta">
      Project: EMORA (Emotional Monitoring &amp; Reflective Activity)<br/>
      Generated: Juni 2026 &nbsp;|&nbsp; PowerDesigner-style PDM
    </div>
  </div>
  <div class="toolbar">
    <button onclick="zoom(1.2)">🔍 Zoom In</button>
    <button onclick="zoom(0.8)">🔎 Zoom Out</button>
    <button onclick="resetZoom()">⟳ Reset</button>
    <button onclick="printPDF()">🖨️ Print / Save PDF</button>
    <span id="zoom-level">100%</span>
  </div>
  <div class="canvas-wrapper" id="wrapper">
    <object id="svgObj" type="image/svg+xml" data="PDM_EMORA_Database.svg"
            width="1600" height="1200" style="display:block;"></object>
  </div>
  <script>
    let scale = 1;
    const obj = document.getElementById('svgObj');
    const lvl = document.getElementById('zoom-level');
    function zoom(f) {
      scale = Math.max(0.3, Math.min(3, scale * f));
      obj.style.transform = `scale(${scale})`;
      obj.style.width = (1600 * scale) + 'px';
      obj.style.height = (1200 * scale) + 'px';
      lvl.textContent = Math.round(scale * 100) + '%';
    }
    function resetZoom() {
      scale = 1;
      obj.style.transform = 'scale(1)';
      obj.style.width = '1600px';
      obj.style.height = '1200px';
      lvl.textContent = '100%';
    }
    function printPDF() {
      window.print();
    }
  </script>
  <style>
    @media print {
      .toolbar { display: none; }
      .header { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .canvas-wrapper { overflow: visible; max-height: none; padding: 0; }
      #svgObj { width: 100% !important; height: auto !important; transform: none !important; }
    }
  </style>
</body>
</html>
